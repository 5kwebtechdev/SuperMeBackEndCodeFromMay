name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ✅ 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # ✅ 2. Setup Java 21
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ✅ 3. Build JAR
      - name: Build JAR
        run: mvn clean package -DskipTests

      # ✅ 4. Debug (VERY IMPORTANT)
      - name: Verify JAR exists
        run: |
          echo "Listing project root"
          ls -la
          echo "Listing target folder"
          ls -la target

      # ✅ 5. Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ✅ 6. Build Docker Image
      - name: Build Docker Image
        run: docker build -t mohitjava/superme:latest .

      # ✅ 7. Push Image
      - name: Push Docker Image
        run: docker push mohitjava/superme:latest

      # ✅ 8. Deploy to server
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull mohitjava/superme:latest
            docker rm -f superme || true
            docker run -d -p 8081:8080 --restart always --name superme mohitjava/superme:latest